<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Configurações — BY Support</title>
  <style>
    body { font-family: sans-serif; padding: 16px; width: 320px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 6px; margin-bottom: 12px; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    #status { margin-top: 10px; font-size: 13px; color: green; }
  </style>
</head>
<body>
  <label for="chave-gemini">Chave da API Gemini</label>
  <input type="password" id="chave-gemini" placeholder="Cole sua chave aqui">
  <button id="salvar">Salvar</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
